    const out = pool.filter(x => !chosen.includes(x));

      const swappable = chosen.filter(x => !fresh.includes(x));
      if (swappable.length) { const drop = swappable[Math.floor(rng() * swappable.length)]; chosen = chosen.filter(x => x !== drop).concat(out[Math.floor(rng() * out.length)]); }
    }

    menu.fresh[cat] = fresh;

  const draw = (pts, col, a, lw) => { if (pts.length < 2) return; ctx.save(); ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 22; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.shadowBlur = 0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = lw * 0.35; ctx.stroke(); ctx.restore(); };

  if (R.strokeFade) { const k = (R.t - R.strokeFade.t) / 0.7; if (k >= 1) R.strokeFade = null; else draw(R.strokeFade.pts, R.strokeFade.col, 1 - k, 9 + k * 10); }
}
function drawCauldron() {
  const { x, y } = CAUL, c = R.cake, col = mixDrops(c.drops), gold = has('auto:glaze');

  ctx.fillStyle = '#231a40';
  for (const sd of [-1, 1]) { rr(x + sd * 50 - 7, y - 30, 14, 34, 6); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(x - 84, y - 120); ctx.quadraticCurveTo(x - 96, y - 18, x, y - 16); ctx.quadraticCurveTo(x + 96, y - 18, x + 84, y - 120); ctx.closePath();

  ell(x, y - 120, 86, 22); ctx.fillStyle = gold ? '#e8a92a' : '#4a3a7a'; ctx.fill();
  ell(x, y - 118, 74, 16); ctx.fillStyle = col ? rgb2hex(col) : '#140f28'; ctx.fill();

    glow(x, y - 130, 90, rgb2hex(col), 0.3);

  }
  let label = 'Казан порожній';

  if (col) { ell(x - lw / 2 + 18, y + 30, 7, 7); ctx.fillStyle = rgb2hex(col); ctx.fill(); }
  txt(label, x + (col ? 10 : 0), y + 30, 16, T1, 'center', 800);
}
